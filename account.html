<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - SportZone</title>
    <link rel="icon" href="images/logo.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="site-header"></header>

    <main class="container">
        <h1 class="page-title">My account</h1>

        <div class="two-col">
            <section class="panel">
                <h2 class="section-title">My orders</h2>
                <div id="orders-msg" class="message"></div>
                <div id="orders-list"><p class="loading">Loading orders...</p></div>
            </section>

            <aside class="panel">
                <h2 class="section-title">Profile</h2>
                <div id="profile-msg" class="message"></div>
                <form id="profile-form" novalidate>
                    <div class="form-group">
                        <label for="p-name">Full name</label>
                        <input type="text" id="p-name" name="fullname" maxlength="100" required>
                    </div>
                    <div class="form-group">
                        <label for="p-email">Email</label>
                        <input type="email" id="p-email" name="email" disabled>
                    </div>
                    <div class="form-group">
                        <label for="p-phone">Phone</label>
                        <input type="tel" id="p-phone" name="phone" maxlength="20">
                    </div>
                    <div class="form-group">
                        <label for="p-address">Address</label>
                        <textarea id="p-address" name="address" rows="3" maxlength="300"></textarea>
                    </div>
                    <button type="submit" class="btn btn-block">Save profile</button>
                </form>
            </aside>
        </div>
    </main>

    <footer id="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/account.js"></script>
</body>
</html>
