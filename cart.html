<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - SportZone</title>
    <link rel="icon" href="images/logo.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="site-header"></header>

    <main class="container">
        <h1 class="page-title">Your cart</h1>
        <div id="cart-msg" class="message"></div>

        <div id="cart-empty" class="panel hidden">
            <p class="empty">Your cart is empty. <a href="products.html">Start shopping</a></p>
        </div>

        <div id="cart-content" class="two-col hidden">
            <div class="panel table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Qty</th>
                            <th>Subtotal</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cart-body"></tbody>
                </table>
                <button class="btn btn-outline btn-small" id="clear-cart" style="margin-top:14px">Clear cart</button>
            </div>

            <aside class="panel">
                <h2 class="section-title">Summary</h2>
                <div class="summary-line"><span>Items</span><span id="cart-items">0</span></div>
                <div class="summary-line"><span>Subtotal</span><span id="cart-subtotal">AED 0.00</span></div>
                <div class="summary-line"><span>Shipping</span><span>Free</span></div>
                <div class="summary-line total"><span>Total</span><span id="cart-total">AED 0.00</span></div>
                <a href="checkout.html" class="btn btn-block" style="margin-top:14px">Proceed to checkout</a>
                <a href="products.html" class="btn btn-outline btn-block" style="margin-top:8px">Continue shopping</a>
            </aside>
        </div>
    </main>

    <footer id="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
